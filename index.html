<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14734a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BadmintonEPS</title>
<style>
:root{
  --vert:rgb(20,115,74); --orange:rgb(250,140,38); --jaune:rgb(252,199,51); --bleu:rgb(51,128,242);
  --rose:rgb(237,77,128); --violet:rgb(140,89,217); --texte:#1c1c1e; --gris:#6e6e73; --carte:#fff;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--texte);
  background:linear-gradient(180deg,rgb(242,250,245),rgb(255,247,235)) fixed;min-height:100vh;font-size:17px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
a{color:inherit;text-decoration:none}
.barre{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;height:50px;padding:0 56px;
  padding-top:env(safe-area-inset-top);box-sizing:content-box;background:rgba(248,250,248,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,0,0,.06)}
.barre h1{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retour{position:absolute;left:8px;bottom:0;height:50px;display:flex;align-items:center;gap:2px;color:var(--vert);font-size:17px;font-weight:500}
.retour span{font-size:30px;line-height:1;margin-top:-4px}
main{max-width:680px;margin:0 auto;padding:16px 16px 110px}
.pile{display:flex;flex-direction:column;gap:16px}
.pile.serre{gap:12px}.pile.p10{gap:10px}
.carte{background:var(--carte);border-radius:22px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.07);width:100%;text-align:left;display:block}
.carte.m14{padding:14px}
.teinte{border-radius:22px;padding:16px;width:100%;text-align:left;display:block}
.ligne{display:flex;align-items:center;gap:14px}
.ligne.haut{align-items:flex-start}
.grandit{flex:1;min-width:0}
.icone{flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;border-radius:50%}
.icone.carre{border-radius:30%}
.chevron{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px}
.etiq{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.titre{font-weight:600;font-size:17px}
.detail{font-size:15px;color:var(--gris)}
.deux{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trois{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.partie{margin-top:6px}
.partie .t{font-size:20px;font-weight:700;display:flex;gap:8px;align-items:center}
.partie .a{font-size:15px;color:var(--gris);margin-top:2px}
.entete{border-radius:26px;padding:20px;color:#fff;display:flex;align-items:center;gap:16px}
.entete .rond{flex:none;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.entete .sur{font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase}
.entete .gt{font-size:22px;font-weight:700;line-height:1.2}
.entete .st{font-size:15px;opacity:.92;margin-top:4px}
.bloc .tete{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bloc .tete b{font-size:17px}
.num{display:flex;flex-direction:column;gap:12px}
.num div{display:flex;gap:12px;align-items:flex-start}
.num i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.puces{display:flex;flex-direction:column;gap:10px}
.puces div{display:flex;gap:10px;align-items:flex-start}
.puces i{flex:none;font-style:normal;width:22px;text-align:center;font-weight:900}
.pastille{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:1px solid rgba(128,128,128,.5);font-family:ui-rounded,-apple-system,sans-serif}
.bouton{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:999px;font-weight:600;color:#fff}
.onglets{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:4px;padding:6px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.14);width:min(420px,calc(100% - 24px))}
.onglets a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:999px;font-size:11px;font-weight:600;color:#555}
.onglets a .e{font-size:22px;line-height:1.1}
.onglets a.actif{background:rgba(20,115,74,.13);color:var(--vert)}
/* animations */
.anim canvas{width:100%;display:block;border-radius:10px}
.anim .etape{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.anim .etape i{flex:none;font-style:normal;width:26px;height:26px;border-radius:50%;background:#ff9500;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
.anim .etape b{font-size:17px;font-weight:600}
.anim .cmd{display:flex;align-items:center;gap:18px;margin-top:10px;font-size:20px;color:var(--vert)}
.anim .cmd button{color:inherit;min-width:32px;height:32px}
.anim .cmd .info{margin-left:auto;font-size:12px;color:var(--gris)}
.anim .cmd .vit{margin-left:auto;font-size:15px;font-weight:700}
.anim .leg{font-size:13px;color:var(--gris);margin-top:8px}
.anim .acteurs{font-size:12px;font-weight:700;color:var(--gris);margin-top:8px}
.sombre .anim .etape b{color:#fff}.sombre .anim .cmd{color:#fff}.sombre .anim .leg,.sombre .anim .acteurs,.sombre .anim .cmd .info{color:rgba(255,255,255,.8)}
/* vue d'ensemble */
.noir{position:fixed;inset:0;z-index:50;background:rgb(15,31,23);overflow-y:auto;color:#fff;-webkit-overflow-scrolling:touch}
.noir .in{max-width:680px;margin:0 auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:60px;display:flex;flex-direction:column;gap:22px}
.noir .lab{font-size:12px;font-weight:700;color:rgb(245,166,77);text-transform:uppercase}
.noir .boite{background:rgba(255,255,255,.10);border-radius:18px;padding:16px}
.seg{display:flex;background:rgba(118,118,128,.24);border-radius:9px;padding:2px;margin-bottom:10px}
.seg button{flex:1;padding:6px;border-radius:7px;font-size:13px;font-weight:600;color:#fff}
.seg button.on{background:rgba(255,255,255,.25)}
.modal{position:fixed;inset:0;z-index:60;overflow-y:auto;background:linear-gradient(180deg,rgb(255,247,230),rgb(230,247,237))}
.modal .in{max-width:680px;margin:0 auto;padding:20px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:50px;display:flex;flex-direction:column;gap:26px}
.fermer{align-self:flex-end;color:var(--vert);font-weight:600;font-size:17px}
.recherche{width:100%;padding:11px 14px;border-radius:12px;border:0;background:rgba(118,118,128,.12);font-size:17px;outline:none}
.champ{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #ccc;background:#fff}
.stat{flex:1;text-align:center;padding:10px 4px;border-radius:12px;background:#f2f2f7}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--gris)}
.reponse{width:100%;display:flex;align-items:center;min-height:56px;padding:16px;border-radius:18px;background:#fff;box-shadow:0 3px 6px rgba(0,0,0,.06);font-weight:600;text-align:left}
.reponse span{flex:1}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>

<script>
const DATA={"exercices":[{"id":"BA1","nom":"Les jongles","theme":"bases","duree":5,"objectif":"Contrôler le volant avec la raquette, en coup droit et en revers.","materiel":"1 raquette et 1 volant par élève.","organisation":"Seul, chacun dans un espace libre.","securite":null,"geste":null,"niveaux":[{"p":1,"defi":"Jongler en coup droit, paume de la main vers le haut.","reussite":"10 jongles d'affilée.","cible":null,"schema":0,"faire":["Je me place dans un espace libre, loin des autres.","Je tiens la raquette devant moi, le tamis à plat, la paume de la main vers le haut.","Je fais monter le volant tout droit au-dessus de ma tête et je compte mes jongles."],"technique":["Prise « poignée de main » : je tiens la raquette en bas du manche, sans serrer fort.","Le tamis reste à plat, face au plafond.","Je garde les yeux sur le volant jusqu'à ce qu'il touche la raquette."]},{"p":2,"defi":"Jongler en revers : même main, le bras passe devant moi, dos de la main vers le haut.","reussite":"10 jongles d'affilée en revers.","cible":null,"schema":1,"faire":["Je tourne la raquette : le dos de ma main regarde le plafond.","Je garde la MÊME main : c'est le bras qui passe devant moi.","Je fais monter le volant en revers et je compte mes jongles."],"technique":["Pouce un peu à plat derrière le manche pour tenir le tamis bien à plat.","Le volant monte devant moi, à hauteur de tête : pas plus haut.","Petit geste du poignet, pas tout le bras."]},{"p":3,"defi":"Alterner coup droit et revers.","reussite":"20 jongles alternés d'affilée.","cible":null,"schema":2,"faire":["Un jongle en coup droit, puis un jongle en revers, et ainsi de suite.","Je tourne la raquette entre deux jongles, pendant que le volant monte.","Je compte seulement les jongles bien alternés."],"technique":["Je tourne la raquette avec les doigts, pas avec tout le bras.","Je fais monter le volant assez haut pour avoir le temps de tourner la raquette.","Je reste léger sur mes pieds pour me replacer sous le volant."]},{"p":4,"defi":"Alterner coup droit et revers en marchant.","reussite":"30 jongles alternés en marchant.","cible":null,"schema":3,"faire":["J'alterne coup droit et revers en marchant tout le long du terrain.","Je reste sur une ligne droite : je ne cours pas après le volant.","Je compte mes jongles jusqu'au bout du terrain, aller et retour."],"technique":["Je pousse le volant un peu vers l'avant à chaque jongle, pour avancer.","Je regarde le volant, pas mes pieds.","Le tamis reste à plat, même en marchant."]}]},{"id":"BA2","nom":"Le lancer de volant","theme":"bases","duree":6,"objectif":"Apprendre le geste du bras armé, sans raquette. C'est le même geste que le dégagé (la frappe haute qui envoie le volant au fond).","materiel":"1 volant pour 2.","organisation":"Par deux, de chaque côté du filet, chacun près de sa ligne de service court. Un volant lancé à la main ne va pas très loin (4 à 6 m) : on reste proche.","securite":null,"geste":"lancerVolant","niveaux":[{"p":1,"defi":"À 1 m du filet, je lance à la main par-dessus le filet. Mon partenaire, à 2 m de l'autre côté, le rattrape.","reussite":"8 lancers sur 10 rattrapés par mon partenaire.","cible":8,"schema":4,"faire":["Je me place à 1 m du filet. Mon partenaire est à 2 m de l'autre côté.","Je tiens le volant par la base, bras armé, coude haut derrière la tête.","Je lance le volant À LA MAIN par-dessus le filet. Mon partenaire le rattrape et me le relance à la main."],"technique":["Je me place de profil, le pied opposé au bras de lancer devant.","Coude haut, main derrière la tête.","Je finis le bras devant moi."]},{"p":2,"defi":"Depuis ma ligne de service court, je lance à la main par-dessus le filet.","reussite":"7 sur 10 dépassent la ligne de service court d'en face.","cible":7,"schema":4,"faire":["Je recule jusqu'à ma ligne de service court.","Je lance À LA MAIN, haut et vers l'avant, par-dessus le filet.","Le volant doit dépasser la ligne de service court d'en face. Mon partenaire me le relance à la main."],"technique":["Je me place de profil, le poids sur la jambe arrière.","Je lance en tournant les épaules, de l'arrière vers l'avant.","Le poids passe sur la jambe avant à la fin du lancer."]},{"p":3,"defi":"Depuis ma ligne de service court, je vise le cerceau (gauche ou droite) que j'annonce, posé à 2 m derrière la ligne de service court d'en face.","reussite":"6 sur 10 dans le cerceau ou tout près.","cible":6,"schema":4,"faire":["Depuis ma ligne de service court, j'annonce le cerceau que je vise : gauche ou droite.","Je lance À LA MAIN vers ce cerceau.","Mon partenaire dit si le volant est tombé dedans ou tout près, puis me le relance."],"technique":["Je regarde le cerceau avant de lancer.","J'oriente mes épaules vers le cerceau visé.","Ma main lâche le volant haut, vers l'avant, dans la direction du cerceau."]},{"p":4,"defi":"Un grand pas derrière ma ligne de service court, je vise le cerceau que mon partenaire annonce juste avant mon lancer.","reussite":"6 sur 10 dans le bon cerceau ou tout près.","cible":6,"schema":4,"faire":["Je recule d'un grand pas derrière ma ligne de service court.","Mon partenaire annonce le cerceau, gauche ou droite, juste avant mon lancer.","Je lance À LA MAIN vers le cerceau annoncé."],"technique":["Même préparation à chaque fois : mon partenaire annonce au dernier moment.","Je change seulement la direction de mes épaules et de ma main.","Je lance plus fort, car je suis plus loin."]}]},{"id":"BA3","nom":"L'échange coopératif","theme":"bases","duree":8,"objectif":"Faire durer l'échange en envoyant le volant haut vers son partenaire.","materiel":"1 volant pour 2.","organisation":"Par deux, de chaque côté du filet.","securite":null,"geste":null,"niveaux":[{"p":1,"defi":"Sans filet, à 3 m l'un de l'autre.","reussite":"10 frappes d'affilée.","cible":null,"schema":5,"faire":["Sans filet : on se place face à face, à 3 m l'un de l'autre.","Je frappe le volant avec la raquette, doucement, vers mon partenaire.","On compte chaque frappe. Si le volant tombe, on repart à zéro."],"technique":["Raquette devant moi entre deux frappes.","Je frappe sous le volant pour le faire monter.","J'accompagne le geste vers mon partenaire."]},{"p":2,"defi":"Par-dessus le filet, volant haut.","reussite":"20 frappes d'affilée.","cible":null,"schema":6,"faire":["On passe de chaque côté du filet, chacun au milieu de son terrain.","Je frappe le volant haut, au milieu du terrain de mon partenaire.","Je peux frapper par en dessous (volant bas) ou au-dessus de ma tête (volant haut)."],"technique":["Je me déplace pour être derrière le volant avant de frapper.","Volant bas : je frappe par en dessous pour le faire monter.","Volant haut : je le frappe au-dessus de ma tête, bras tendu."]},{"p":3,"defi":"Chaque volant passe derrière la ligne de service court.","reussite":"20 frappes d'affilée, toutes assez longues.","cible":null,"schema":7,"faire":["Chacun au milieu de son terrain.","Chaque volant doit tomber derrière la ligne de service court de mon partenaire.","Si un volant est trop court, on repart à zéro."],"technique":["Je frappe plus fort et plus haut pour envoyer le volant plus loin.","Je suis prêt entre chaque frappe : genoux un peu fléchis, raquette devant moi.","Je recule si le volant va loin derrière moi."]},{"p":4,"defi":"Chacun se place au fond de son terrain. Chaque volant doit retomber au-delà de la ligne de service long du double, et je frappe au-dessus de ma tête dès que je peux.","reussite":"20 frappes d'affilée, toutes au fond.","cible":null,"schema":8,"faire":["Chacun se place au fond de son terrain.","Chaque volant doit retomber au-delà de la ligne de service long du double.","Je frappe au-dessus de ma tête dès que je peux."],"technique":["Je recule de profil pour me placer derrière le volant.","Bras armé, coude haut, je frappe le volant le plus haut possible.","Je reviens au milieu de ma moitié arrière entre deux frappes."]}]},{"id":"BA4","nom":"Les cerceaux","theme":"bases","duree":10,"objectif":"Viser : envoyer le volant à un endroit choisi.","materiel":"10 volants, 4 cerceaux posés dans le terrain d'en face.","organisation":"Par deux : un lanceur et un frappeur. Le lanceur lance le volant à la main. Celui qui envoie le volant compte les réussites. On change de rôle tous les 10 volants.","securite":null,"geste":null,"niveaux":[{"p":1,"defi":"Je vise n'importe quel cerceau.","reussite":"5 volants sur 10 près d'un cerceau.","cible":5,"schema":9,"faire":["Le lanceur est de l'autre côté du filet. Il me lance le volant à la main, haut, devant moi.","Je frappe le volant avec la raquette vers n'importe quel cerceau.","Le lanceur regarde si le volant tombe dans un cerceau ou tout près."],"technique":["Je regarde le volant jusqu'à la frappe.","J'accompagne le geste vers les cerceaux.","Je dose ma force : pas trop fort."]},{"p":2,"defi":"Je vise le cerceau que j'ai annoncé.","reussite":"5 sur 10 près du bon cerceau.","cible":5,"schema":9,"faire":["Avant chaque frappe, j'annonce le cerceau que je vise.","Le lanceur me lance le volant à la main.","Je frappe le volant avec la raquette vers le cerceau annoncé."],"technique":["Je regarde ma cible avant que le volant arrive, puis je regarde le volant.","J'oriente mes épaules et le tamis vers le cerceau visé.","Plus doux pour un cerceau proche, plus fort pour un cerceau loin."]},{"p":3,"defi":"Le lanceur annonce le cerceau au moment du lancer.","reussite":"6 sur 10 près du bon cerceau.","cible":6,"schema":9,"faire":["C'est le lanceur qui annonce le cerceau, au moment où il lance.","Je dois réagir vite et viser ce cerceau.","Le lanceur change de cerceau à chaque fois."],"technique":["Je me prépare de la même façon pour tous les cerceaux.","Je décide la direction au dernier moment, en tournant le tamis.","Je regarde le volant, pas le lanceur, au moment de frapper."]},{"p":4,"defi":"Volant envoyé à la raquette, cerceaux dans les coins.","reussite":"6 sur 10 dans le bon coin.","cible":6,"schema":10,"faire":["Les cerceaux sont dans les 4 coins du terrain d'en face.","Mon partenaire m'envoie le volant AVEC LA RAQUETTE.","J'annonce le coin que je vise et je frappe le volant avec la raquette vers ce coin."],"technique":["Je me déplace pour me placer derrière le volant avant de frapper.","Coins du fond : je frappe haut et fort. Coins du filet : je frappe doucement.","Je garde la même préparation pour que mon partenaire ne devine pas."]}]},{"id":"SV7","nom":"Apprendre à servir en coup droit","theme":"servir","duree":10,"objectif":"Réussir à mettre le volant en jeu quand on ne sait pas encore servir : lâcher le volant, puis le frapper sous la taille.","materiel":"5 volants par élève, un mur (ou le filet), une ligne au mur à 1,55 m.","organisation":"Seul ou par deux, à 3 m d'un mur ou du filet. Le partenaire ramasse et regarde le geste.","securite":"Je laisse 2 mètres libres autour de moi avant de balancer la raquette.","geste":"serviceCoupDroit","niveaux":[{"p":1,"defi":"Je tiens la raquette court (main près du tamis). Je lâche le volant et je le frappe vers le mur.","reussite":"8 sur 10 touchent le mur.","cible":8,"schema":null,"faire":["Je me place à 3 m d'un mur, de profil, pied gauche devant (pied droit si je suis gaucher).","Je tiens la raquette COURT : ma main est près du tamis. C'est plus facile de toucher le volant.","Je tiens le volant À LA MAIN par les plumes, bras tendu devant moi. Je le LÂCHE et je le frappe vers le mur."],"technique":["Je lâche le volant : j'ouvre les doigts, je ne le lance pas.","Je regarde le volant jusqu'à ce qu'il touche la raquette.","La raquette vient d'en bas, comme un balancier."]},{"p":2,"defi":"Raquette tenue normalement, je frappe vers le mur, au-dessus de la ligne à 1,55 m.","reussite":"7 sur 10 au-dessus de la ligne.","cible":7,"schema":null,"faire":["Je tiens maintenant la raquette normalement, en bas du manche.","Je recule la raquette derrière moi, poignet cassé.","Je lâche le volant et je le frappe vers le mur, au-dessus de la ligne à 1,55 m (la hauteur du filet)."],"technique":["Le poids est sur le pied arrière au départ.","Je frappe le volant plus bas que ma taille, devant mon pied avant.","Je finis la raquette haut, vers mon épaule opposée."]},{"p":3,"defi":"Je sers par-dessus le filet depuis le milieu de mon terrain.","reussite":"7 sur 10 passent le filet et tombent dans le terrain.","cible":7,"schema":null,"faire":["Je passe au filet : je me place au milieu de mon terrain.","Je lâche le volant et je le frappe par-dessus le filet.","Le volant doit passer le filet et tomber dans le terrain d'en face."],"technique":["Mes deux pieds restent au sol pendant le service.","Le poids passe du pied arrière au pied avant.","La raquette finit haut : c'est elle qui fait monter le volant."]},{"p":4,"defi":"Je sers depuis ma case de service, en diagonale.","reussite":"7 sur 10 dans la case d'en face.","cible":7,"schema":null,"faire":["Je me place dans ma case de service, près de la ligne centrale.","Je sers en diagonale, comme en match.","Le volant doit tomber dans la case d'en face, en diagonale."],"technique":["J'oriente mes épaules et mon pied avant vers la case d'en face.","Je frappe sous la taille, les deux pieds au sol.","Je finis la raquette vers la case visée."]}]},{"id":"SV8","nom":"Apprendre à servir en revers","theme":"servir","duree":10,"objectif":"Réussir un service court, simple et précis : le volant est poussé tout près de la raquette, presque sans geste.","materiel":"5 volants par élève.","organisation":"Par deux, de chaque côté du filet, près de la ligne de service court. Le partenaire rattrape le volant et le renvoie à la main.","securite":null,"geste":"serviceRevers","niveaux":[{"p":1,"defi":"Sans filet : je pousse le volant vers mon partenaire, à 2 m, qui le rattrape à la main.","reussite":"8 sur 10 rattrapés.","cible":8,"schema":null,"faire":["Sans filet : je suis face à mon partenaire, à 2 m.","Prise revers, raquette devant moi, tête de raquette vers le bas. Je tiens le volant à la main par les plumes, juste devant le tamis.","Je lâch sse juste au-dessus de la raquette levée de l'adversaire, sans qu'il puisse le toucher, et tombe vite au fond."],"technique":["Je me place bien derrière le volant pour le frapper devant moi.","Je frappe plus devant moi, bras tendu.","La raquette part vers l'avant, plus à plat."]},{"p":3,"defi":"Au moment de lancer, le lanceur crie « haut » ou « tendu » : je joue le dégagé demandé.","reussite":"7 sur 10 avec la bonne trajectoire et au fond.","cible":7,"schema":39,"faire":["Au moment de lancer, le lanceur crie « haut » ou « tendu ».","« Haut » : je joue un dégagé défensif. « Tendu » : je joue un dégagé d'attaque.","Les deux doivent tomber au fond."],"technique":["Même préparation pour les deux : l'adversaire ne doit pas deviner.","Je décide au dernier moment : raquette vers le plafond ou vers l'avant.","Après la frappe, je reviens au centre."]},{"p":4,"defi":"Le lanceur lance tantôt juste au-dessus de moi (je suis bien placé), tantôt loin derrière moi (je dois reculer vite). Je choisis seul le bon dégagé.","reussite":"7 bons choix sur 10, tous au fond.","cible":7,"schema":39,"faire":["Le lanceur lance tantôt juste au-dessus de moi, tantôt loin derrière moi.","Je choisis seul : en retard, je joue défensif ; bien placé, je joue l'attaque.","Je me pose une question : « Est-ce que j'ai le temps ? » Non : défensif. Oui : attaque."],"technique":["Je lis vite la trajectoire du lancer pour savoir si je serai en retard.","En retard : je frappe haut pour avoir le temps de revenir.","Bien placé : je frappe devant moi, plus tendu."]}]},{"id":"DG7","nom":"Le dégagé sous pression","theme":"degage","duree":10,"objectif":"Renvoyer au fond même quand on est déplacé à gauche ou à droite.","materiel":"1 volant pour 2.","organisation":"Par deux. Le partenaire, au centre, envoie avec la raquette à gauche ou à droite de mon fond de terrain.","securite":null,"geste":null,"niveaux":[{"p":1,"defi":"Le partenaire alterne gauche et droite, lentement.","reussite":"6 frappes d'affilée au fond."," ection de son dégagé pour déborder l'adversaire.","materiel":"10 volants, plots dans les deux coins du fond adverse.","organisation":"Par deux : un envoyeur et un frappeur dans un coin du fond. L'envoyeur, de l'autre côté du filet, me sert long avec la raquette dans mon coin du fond. Celui qui envoie le volant compte les réussites. On change de rôle tous les 10 volants.","securite":null,"geste":null,"niveaux":[{"p":1,"defi":"Je vise toute la moitié gauche ou droite du fond.","reussite":"6 sur 10 du bon côté.","cible":6,"schema":41,"faire":["Mon partenaire, de l'autre côté du filet, me sert long avec la raquette dans mon coin du fond.","Je vise toute la moitié gauche ou toute la moitié droite du fond d'en face.","J'annonce la moitié que je vise avant de frapper."],"technique":["Même préparation : bras armé, de profil.","J'oriente les épaules vers la moitié visée.","Je frappe haut et loin."]},{"p":2,"defi":"Je vise le coin le long de la ligne.","reussite":"6 sur 10 dans le coin.","cible":6,"schema":42,"faire":["Mon partenaire me sert long dans mon coin du fond.","Je vise le coin long de ligne : le volant part tout droit, le long de la ligne de côté.","Le volant doit tomber dans le coin juste en face de moi."],"technique":["Long de ligne : le tamis regarde droit devant, le long de la ligne de côté.","Je ne vise pas trop près de la ligne : un volant dedans vaut mieux qu'un volant dehors.","Je frappe haut pour qu'il retombe au fond."]},{"p":3,"defi":"Le partenaire annonce « ligne » ou « croisé ».","reussite":"7 sur 10 dans le coin annoncé.","cible":7,"schema":42,"faire":["Mon partenaire annonce « ligne » ou « croisé » juste avant ma frappe.","Ligne : tout droit le long de la ligne de côté. Croisé : en diagonale, vers l'autre coin.","Je vise le coin annoncé."],"technique":["Même préparation pour les deux directions.","Croisé : je tourne un peu plus les épaules et le tamis vers l'autre coin.","Le croisé est plus long : je frappe un peu plus fort."]},{"p":4,"defi":"Je choisis seul : le partenaire ne doit pas deviner.","reussite":"8 sur 10 dans le coin, sans que le partenaire devine.","cible":8,"schema":42,"faire":["Je choisis seul, ligne ou croisé, sans rien dire.","Mon partenaire essaie de deviner le coin avant ma frappe.","Je vise le coin choisi, sans que mon partenaire devine."],"technique":["Préparation identique : mon corps ne doit pas montrer mon choix.","Je décide au dernier moment, avec le tamis et le poignet.","Je regarde le volant, pas le coin visé, au moment de frapper."]}]},{"id":"DP2","nom":"Les 6 coins","theme":"deplacer","duree":8,"objectif":"Se déplacer vite vers les coins du terrain et revenir au centre.","materiel":"6 volants sur 6 plots, un cerceau au centre.","organisation":"Par deux : un joueur, un meneur qui montre un coin. 30 secondes d'effort, 30 secondes de repos.","securite":null,"geste":null,"niveaux":[{"p":1,"defi":"4 coins seulement (2 au filet, 2 au fond).","reussite":"8 coins en 30 secondes.","cible":null,"schema":43,"faire":["Je pars du cerceau, au centre, raquette en main. 4 plots seulement : 2 au filet, 2 au fond.","Le meneur montre un coin, j'y vais et je touche le volant posé sur le plot avec ma raquette.","Je reviens dans le cerceau. 30 secondes d'effort, puis 30 secondes de repos."],"technique":["Je pars du centre sur l'avant des pieds.","Je reviens toujours dans le cerceau avant le coin suivant."]},{"p":2,"defi":"6 coins, en pas chassés.","reussite":"8 coins en 30 secondes, retour au centre à chaque fois.","cible":null,"schema":44,"faire":["Maintenant 6 plots : 2 au filet, 2 sur les côtés, 2 au fond.","Je me déplace en pas chassés vers chaque coin montré par le meneur.","Je reviens dans le cerceau à chaque fois."],"technique":["Pas chassés : un pied rejoint l'autre sans le croiser.","Vers le fond : je me tourne de profil.","Vers le filet : grand pas en fente, jambe de raquette devant."]},{"p":3,"defi":"6 coins avec un geste de frappe à chaque coin.","reussite":"10 coins en 30 secondes.","cible":n 45,0,0.95,0.16,1.2,0.4,1.1,0.2,1.24,0.1,1.02,0.24,0.5,0.4,0.04,-0.16,0.5,-0.34,0.04],"ang":365,"regard":1},"duree":0.35,"pause":1.6,"texte":"La raquette s'arrête vite : le volant rase le filet et tombe juste derrière."}],"objet":"raquette","depart":{"type":"mainLibre","lacher":1,"monte":0},"contact":2,"arriveeVolant":[3.3,0],"apexVolant":1.7,"legende":"Le service court en coup droit, vu de profil : je lâche le volant, puis je le pousse doucement avec la raquette, sans grand geste.","dureeVol":1.1,"filetX":2,"zoom":1.55}},"fiches":[{"id":"R01","rubrique":"regles","titre":"Le terrain et les lignes","icone":"rectangle.split.3x3","resume":"Le terrain est le même pour le simple et le double, mais on n'utilise pas les mêmes lignes.","points":["Le terrain mesure 13,40 m de long.","Largeur : 6,10 m en double, 5,18 m en simple. En simple, les couloirs de côté sont dehors.","Les lignes font partie du terrain : un volant qui touche la ligne est bon.","On regarde l'endroit où le volant touche le sol, pas l'endroit où il roule ensuite.","La ligne de service court est à 1,98 m du filet. La ligne de service long du double est à 76 cm de la ligne de fond.","La ligne centrale sépare la case de service droite et la case gauche."],"aRetenir":"Volant sur la ligne = volant bon. En simple : terrain long et étroit. En double : terrain large.","illustration":"lignesSimpleDouble","schema":null},{"id":"R02","rubrique":"regles","titre":"Le filet, le volant et la raquette","icone":"leaf.fill","resume":"Le matériel est le même pour tous les joueurs.","points":["Le filet est à 1,55 m de haut aux poteaux et à 1,524 m au centre.","Les poteaux sont placés sur les lignes de côté du double.","Le volant a 16 plumes (ou une jupe en plastique) plantées dans une base arrondie. Il pèse environ 5 grammes.","La raquette mesure au maximum 68 cm de long et 23 cm de large.","On ne change pas de volant sans l'accord de l'arbitre (ou de l'adversaire s'il n'y a pas d'arbitre)."],"aRetenir":"Filet à 1,55 m aux poteaux. Volant de 16 plumes, environ 5 g.","schema":null},{"id":"R03","rubrique":"regles","titre":"Le tirage au sort","icone":"circle.lefthalf.filled","resume":"Avant le match, on tire au sort pour savoir qui choisit en premier.","points":["Le gagnant du tirage au sort choisit : servir ou recevoir en premier, OU le côté du terrain.","Le perdant prend le choix qui reste.","À l'école, on peut tirer au sort avec une pièce ou en lançant le volant : il pointe vers celui qui choisit."],"aRetenir":"Le gagnant du tirage choisit le service ou le côté, l'autre prend ce qui reste.","schema":null},{"id":"R04","rubrique":"regles","titre":"Compter les points","icone":"number","resume":"Chaque échange rapporte un point, quel que soit celui qui servait.","points":["Celui qui gagne l'échange marque 1 point.","Celui qui gagne l'échange sert le point suivant.","Un set se gagne à 21 points.","Il faut 2 points d'écart : à 20-20, on continue jusqu'à 22-20, 23-21…","À 29-29, le premier qui marque le 30e point gagne le set.","Un match se joue en 2 sets gagnants (3 sets au maximum).","Le gagnant d'un set sert en premier au set suivant.","À l'école, on joue souvent en 11 ou 15 points, ou au temps."],"aRetenir":"21 points, 2 points d'écart, maximum 30. Celui qui gagne l'échange marque et sert.","schema":null},{"id":"R05","rubrique":"regles","titre":"Annoncer le score","icone":"megaphone.fill","resume":"Le score s'annonce à voix haute après chaque point.","points":["On annonce toujours le score du serveur en premier. Exemple : le serveur a 8, l'adversaire 5 → « 8-5 ».","Au début d'un set : « 0-0, jouez ! » (« Love all, play » en anglais).","Quand un joueur arrive à 20 et peut gagner : on annonce « point de set » ou « point de match ».","À la fin d'un set, on annonce le gagnant et le score."],"aRetenir":"Score du serveur d'abord, à voix haute, après chaque point.","schema":null},{"id":"R06","rubrique":"regles","titre":"Les pauses et les changements de côté","icone":"arrow.left.arrow.right","resume":"Dans un vrai match, il y a des pauses courtes et on change de côté.","points":["Quand un joueur atteint 11 points dans un set : pause de 60 secondes maximum.","Entre deux sets : pause de 2 minutes maximum.","On change de côté à la fin du 1er set, à la fin du 2e set s'il y a un 3e set, et dans le 3e set quand un joueur atteint 11 points.","Le coach ne peut parler à son joueur que pendant ces pauses."],"aRetenir":"Pause à 11 points, changement de côté à chaque set (et à 11 au 3e set).","schema":null},{"id":"R07","rubrique":"regles","titre":"Le service : de quel côté ?","icone":"arrow.up.right.and.arrow.down.left","resume":"En simple, c'est le score du serveur qui décide du côté.","points":["Score du serveur pair (0, 2, 4…) : il sert de sa case DROITE.","Score du serveur impair (1, 3, 5…) : il sert de sa case GAUCHE.","Le service se fait toujours en DIAGONALE, vers la case opposée.","Le receveur se place dans la case en diagonale du serveur.","Si le serveur gagne l'échange, il marque et sert de l'autre case. Si le receveur gagne, il marque et devient serveur."],"aRetenir":"Pair à droite, impair à gauche, toujours en diagonale.","schema":116},{"id":"R08","rubrique":"regles","titre":"Le service : comment servir sans faute","icone":"checkmark.shield.fill","resume":"Le service a des règles précises. Si l'une n'est pas respectée, c'est faute.","points":["Le serveur et le receveur sont dans leur case, sans toucher les lignes.","Les deux pieds restent en contact avec le sol jusqu'à la frappe (on ne saute pas, on ne fait pas un pas).","Au moment de la frappe, tout le volant est à moins de 1,15 m du sol (à peu près la taille).","On frappe d'abord la base du volant (le bouchon), pas les plumes.","Le geste de la raquette va vers l'avant, d'un seul mouvement, sans arrêt ni feinte.","Le volant doit passer le filet et tomber dans la case de service opposée (les lignes sont bonnes).","Si le serveur rate complètement le volant en essayant de servir : faute.","Le serveur ne sert pas tant que le receveur n'est pas prêt."],"aRetenir":"Pieds au sol, volant sous 1,15 m, un seul geste vers l'avant, en diagonale.","schema":null},{"id":"R09","rubrique":"regles","titre":"Les cases de service","icone":"square.split.2x2","resume":"La case où doit tomber le service n'est pas la même en simple et en double.","points":["En simple : la case va de la ligne de service court jusqu'à la ligne de FOND, entre la ligne centrale et la ligne de côté du SIMPLE. Elle est longue et étroite.","En double : la case va de la ligne de service court jusqu'à la ligne de service LONG DU DOUBLE, entre la ligne centrale et la ligne de côté du DOUBLE. Elle est courte et large.","Pendant l'échange (après le service), on joue sur tout le terrain du simple ou du double."],"aRetenir":"Service en simple : long et étroit. Service en double : court et large.","schema":117},{"id":"R10","rubrique":"regles","titre":"Le double : qui sert ?","icone":"person.2.fill","resume":"En double, une seule personne sert à la fois et les joueurs ne changent de case que dans un cas.","points":["Le score de l'équipe qui sert décide de la case : pair, c'est le joueur dans la case droite qui sert ; impair, celui de la case gauche.","Si l'équipe qui sert gagne l'échange : elle marque, et le MÊME serveur sert à nouveau, depuis l'autre case (les deux partenaires échangent leurs cases).","Si l'équipe qui reçoit gagne l'échange : elle marque et devient l'équipe qui sert. Ses joueurs ne changent PAS de case.","Seul le receveur en diagonale peut renvoyer le service. Ensuite, n'importe quel joueur peut frapper.","Les joueurs ne changent de case que lorsqu'ils gagnent un point sur leur propre service."],"aRetenir":"On change de case seulement quand on gagne le point sur son propre service.","schema":null},{"id":"R11","rubrique":"regles","titre":"Les fautes pendant l'échange","icone":"xmark.octagon.fill","resume":"Dès qu'il y a faute, l'échange s'arrête et l'adversaire marque le point.","points":["Le volant tombe dehors.","Le volant passe sous le filet, à travers le filet, ou ne passe pas le filet.","Le volant touche le plafond, un mur ou un objet.","Le volant touche un joueur ou ses vêtements.","Le même joueur frappe deux fois de suite, ou les deux partenaires frappent l'un après l'autre (en double).","Le volant est porté ou lancé : il reste sur la raquette au lieu d'être frappé.","Un joueur touche le filet ou les poteaux avec sa raquette, son corps ou ses vêtements.","Un joueur frappe le volant avant qu'il ait passé le filet (chez l'adversaire). Après sa frappe, la raquette peut passer au-dessus du filet.","Un joueur passe sous le filet et gêne l'adversaire.","Un joueur gêne ou distrait volontairement l'adversaire (cris, gestes)."],"aRetenir":"Volant dehors, dans le filet, sur un joueur, toucher le filet, frapper deux fois : faute.","schema":null},{"id":"R12","rubrique":"regles","titre":"Le let : on rejoue le point","icone":"arrow.counterclockwise","resume":"Un « let » arrête l'échange et on rejoue le point sans que personne ne marque.","points":["Un volant d'un autre terrain arrive sur le terrain, ou un incident imprévu se produit.","Le serveur sert alors que le receveur n'était pas prêt (et que le receveur n'a pas essayé de renvoyer).","Le volant reste accroché dans le filet ou sur le filet après l'avoir passé.","Le serveur et le receveur font une faute en même temps.","Le volant se casse : la base se sépare des plumes.","Personne n'a vu si le volant était dedans ou dehors (juge de ligne masqué et arbitre qui ne peut pas décider)."],"aRetenir":"Let = on rejoue le point, le score ne change pas.","schema":null},{"id":"R13","rubrique":"regles","titre":"Le fair-play et le comportement","icone":"hands.clap.fill","resume":"Le badminton se joue dans le respect de l'adversaire, de l'arbitre et du matériel.","points":["On salue l'adversaire et l'arbitre avant et après le match (poignée de main ou check).","On accepte les décisions de l'arbitre, sans discuter.","On ne retarde pas le jeu volontairement et on ne quitte pas le terrain sans autorisation.","On ne jette pas sa raquette, on ne frappe pas le filet.","Sans arbitre : chacun juge honnêtement les volants de son côté. En cas de doute, on rejoue le point.","Après le match, on félicite l'adversaire et on commente le résultat avec une vraie raison."],"aRetenir":"Saluer, respecter l'arbitre, accepter le résultat.","schema":null},{"id":"J01","rubrique":"roles","titre":"L'arbitre : où se placer","icone":"flag.fill","resume":"L'arbitre doit voir les deux terrains et suivre le volant.","points":["Il se place au niveau du filet, sur le côté du terrain, à 1 ou 2 mètres de la ligne de côté (sur une chaise haute dans les compétitions).","Il reste immobile pendant l'échange et suit le volant des yeux.","Les juges de ligne sont assis au fond et sur les côtés, face à la ligne qu'ils surveillent.","Dans les compétitions, un juge de service est assis près du filet, face à l'arbitre : il surveille les fautes de service."],"aRetenir":"Arbitre au niveau du filet, sur le côté. Juges de ligne face à leur ligne.","schema":118},{"id":"J02","rubrique":"roles","titre":"L'arbitre : son rôle","icone":"person.badge.shield.checkmark.fill","resume":"L'arbitre dirige le match du début à la fin.","points":["Il fait le tirage au sort et annonce le début du match : « 0-0, jouez ! ».","Il annonce le score après chaque point, celui du serveur d'abord.","Il vérifie que le service se fait du bon côté et sans faute.","Il annonce « faute » ou « let » et décide qui gagne le point.","Il décide quand un juge de ligne n'a pas vu. S'il ne peut pas décider non plus : let.","Il fait respecter les pauses, les changements de côté et le fair-play.","À la fin, il annonce le vainqueur et le score de chaque set."],"aRetenir":"L'arbitre annonce le score, juge les fautes et fait respecter les règles.","schema":null},{"id":"J03","rubrique":"roles","titre":"Le juge de ligne","icone":"hand.raised.fill","resume":"Le juge de ligne dit si le volant est tombé dedans ou dehors, sur sa ligne.","points":["Il regarde uniquement sa ligne, jamais les joueurs.","Dehors : il crie « dehors » et tend les deux bras à l'horizontale, sur les côtés.","Dedans : il montre la ligne avec la main droite, sans rien dire.","Pas vu (masqué) : il met les deux mains devant les yeux. L'arbitre décide.","Sa décision est définitive : l'arbitre ne peut la changer que s'il est sûr qu'elle est fausse."],"aRetenir":"Dehors : bras écartés. Dedans : main vers la ligne. Pas vu : mains sur les yeux.","schema":null},{"id":"J04","rubrique":"roles","titre":"Le coach","icone":"megaphone.fill","resume":"Le coach aide son joueur à progresser et à gagner, en le regardant jouer.","points":["Il observe son joueur pendant tout le match (avec l'outil « Observer » par exemple).","Il ne parle pas pendant l'échange : seulement pendant les pauses (à 11 points et entre les sets) ou la pause prévue par le prof.","Il dit UNE chose qui marche et donne UN conseil précis (« Joue plus au fond », pas « Joue mieux »).","Il peut préparer un plan de match avec son joueur avant le match.","Il encourage, même quand son joueur perd."],"aRetenir":"Le coach observe, parle seulement aux pauses, donne un conseil précis et encourage.","schema":null},{"id":"J05","rubrique":"roles","titre":"Le mini-prof","icone":"person.2.fill","resume":"Le mini-prof aide un camarade à progresser. C'est idéal pour les joueurs de club.","points":["Il choisit avec son camarade un exercice et un niveau adaptés.","Il lance le volant à la main, à la bonne hauteur, un peu devant son camarade, quand il est prêt. Il se place à 3 ou 4 m de lui : un lancer à la main ne va pas plus loin.","Il compte les réussites et ramasse les volants avec lui.","Il montre le geste lentement et donne UNE consigne à la fois.","Il lit la fiche de l'exercice dans l'appli pour l'expliquer à son groupe.","Il encourage et dit ce qui est réussi."],"aRetenir":"Bien lancer à la main, montrer, une consigne à la fois, encourager.","sch function volant(g,c,dir,r){

  g.fillStyle=C(0.98,0.94,0.84);g.fill();g.strokeStyle='rgba(0,0,0,.8)';g.lineWidth=Math.max(0.8,r*0.15);g.stroke();

function nomActeur(a){ if(estMoi(a)) return 'moi';

const estCentre=p=>Math.hypot(p[0]-3.4,p[1]-3.05)<0.6||Math.hypot(p[0]-10,p[1]-3.05)<0.6;

function phraseCoup(s,c,h,i){

function legendeActeurs(s){ const vus=[]; let h='';

function pointCourbe(c,f){ const p0=c.de,p2=c.a;

const ratioSchema=s=>s.vue==='dessus'?13.4/6.1:s.vue==='cote'?13.4/5:6/3.4;

function dessinerSchema(g,s,etat,W,H,temps){

  g.total=g.phases.reduce((s,p)=>s+p.duree+p.pause,0)+0.6;
  let t=0; g.arrivees=g.phases.map(p=>{t+=p.duree; const a=t; t+=p.pause; return a;});
  g.suivi=p=>g.objet==='raquette'?tamis(p):p.mL;

  g.ctrlSortie=ctrl(g.contactPt,G.arriveeVolant,G.apexVolant);

const ctrl=(a,b,apex)=>[(a[0]+b[0])/2,2*apex-(a[1]+b[1])/2];

function routeur(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,'')); const p=h.split('/').filter(Boolean);
  WIDGETS=WIDGETS.filter(w=>w.permanent); fermerNoir();
  let r;
  if(!p.length) r=pageAccueil();
  else if(p[0]==='theme') r=pageTheme(p[1]);
  else if(p[0]==='ex'&&p.length===2) r=pageExercice(p[1]);
  else if(p[0]==='ex') r=pageNiveau(p[1],+p[2]);
  else if(p[0]==='problemes') r=pageProblemes();
  else if(p[0]==='probleme') r=pageProbleme(p[1]);
  else if(p[0]==='rubrique') r=pageRubrique(p[1]);
  else if(p[0]==='fiche') r=pageFiche(p[1]);
  else if(p[0]==='outils') r=pageOutils();
  else if(p[0]==='observer') r=pageObserver();
  else if(p[0]==='quiz') r=pageQuiz();
  else r=pageAccueil();
  const page=document.getElementById('page'); page.innerHTML=r.html;
  document.getElementById('titre').textContent=r.titre; document.title=r.titre==='BadmintonEPS'?'BadmintonEPS':r.titre+' · BadmintonEPS';
  document.getElementById('retour').hidden=!r.retour;
  const onglet=['problemes','probleme'].includes(p[0])?'problemes':['outils','observer','quiz'].includes(p[0])?'outils':'themes';
  document.querySelectorAll('#onglets a').forEach(a=>a.classList.toggle('actif',a.dataset.t===onglet));

  window.scrollTo(0,0);
}

let noirOuvert=null;
function fermerNoir(){ if(noirOuvert){ noirOuvert.remove(); noirOuvert=null; document.body.style.overflow=''; WIDGETS=WIDGETS.filter(w=>!w.noir); if(window._chrono) clearInterval(window._chrono);} }
function ouvrirNoir(e,plumeDepart){
  fermerNoir(); const div=document.createElement('div'); div.className='noir sombre'; document.body.appendChild(div); noirOuvert=div; document.body.style.overflow='hidden';
  const orange=C(0.96,0.65,0.30);

  const avecChrono=[e.organisation,...e.niveaux.flatMap(n=>[n.defi,n.reussite])].some(x=>/seconde|minute/i.test(x));
  window._chrono=setInterval(()=>{ if(st.actif){st.sec++; const c=div.querySelector('#chr'); if(c) c.textContent=String(Math.floor(st.sec/60)).padStart(2,'0')+':'+String(st.sec%60).padStart(2,'0');}},1000);
  function rendre(){
    WIDGETS=WIDGETS.filter(w=>!w.noir);
    const n=e.niveaux.find(x=>x.p===st.p); const reussis=st.res.filter(Boolean).length, fini=st.res.length>=10;
    let h=`<div class="in"><div class="ligne"><span style="background:#fff;color:${col(COUL.vert)};border-radius:999px;padding:6px 12px;font-weight:600">🏸 Motricité</span>

      <div style="font-size:34px;font-weight:900;line-height:1.1">${esc(e.nom)}</div>
      <div><div class="lab">Le but</div><div style="font-size:20px;margin-top:6px">${esc(e.objectif)}</div></div>
      <div style="display:flex;gap:8px">${e.niveaux.map(x=>`<button data-p="${x.p}" style="flex:1;min-height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
        background:${x.p===st.p?'rgba(255,255,255,.22)':'rgba(255,255,255,.06)'};border:2px solid ${x.p===st.p?orange:'transparent'}">${pastille(x.p,30)}<span style="font-size:12px;font-weight:700">${PLUMES[x.p].nom}</span></button>`).join('')}</div><div>`;
    if(e.geste&&n.schema!=null) h+=`<div class="seg"><button data-v="0" class="${st.geste?'':'on'}">L'exercice</button><button data-v="1" class="${st.geste?'on':''}">Le geste de profil</button></div>`;
    if(e.geste&&(st.geste||n.schema==null)) h+=`<div data-geste="${e.geste}"></div>`; else if(n.schema!=null) h+=`<div data-schema="${n.schema}"></div>`;
    h+=`</div><div style="display:flex;flex-direction:column;gap:16px"><div class="lab">Ce que je dois faire</div>
      ${n.faire.map((f,k)=>`<div class="ligne haut"><span style="flex:none;width:40px;height:40px;border-radius:50%;background:${orange};color:rgb(15,31,23);font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center">${k+1}</span><span style="font-size:20px;font-weight:600">${esc(f)}</span></div>`).join('')}
      ${n.technique.length?`<div class="boite"><div class="lab" style="margin-bottom:10px">Comment bien faire</div>${n.technique.map(x=>`<div class="ligne haut" style="gap:10px;margin-top:8px"><span style="color:${orange}">👉</span><span style="font-weight:500">${esc(x)}</span></div>`).join('')}</div>`:''}</div>
      <div class="boite"><div class="lab">Mon défi · ${PLUMES[st.p].nom.toUpperCase()}</div><div style="font-size:20px;font-weight:600;margin-top:10px">${esc(n.defi)}</div>
      <div class="lab" style="margin-top:14px">C'est réussi si…</div><div style="font-size:20px;margin-top:10px">${esc(n.reussite)}</div></div>`;
    if(avecChrono) h+=`<div class="boite ligne"><span id="chr" style="font:700 44px ui-monospace,Menlo,monospace">${String(Math.floor(st.sec/60)).padStart(2,'0')}:${String(st.sec%60).padStart(2,'0')}</span>
      <button data-c="go" style="margin-left:auto;width:56px;height:56px;border-radius:50%;background:${col(COUL.vert)};font-size:22px">${st.actif?'⏸︎':'▶︎'}</button><button data-c="raz" style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.15);font-size:22px">↺</button></div>`;
    if(n.cible){ h+=`<div class="boite" style="display:flex;flex-direction:column;gap:16px"><div><span style="font:900 56px ui-rounded,-apple-system,sans-serif">${reussis}</span> <span style="font-size:20px;opacity:.8">réussis · ${st.res.length}/10 essais</span></div>
      <div style="display:flex;gap:6px">${Array.from({length:10},(_,i)=>`<span style="width:24px;height:24px;border-radius:50%;${i<st.res.length?`background:${st.res[i]?'#34c759':'#ff3b30'}`:'border:2px solid rgba(255,255,255,.4)'}"></span>`).join('')}</div>`;
      if(fini){ const ok=reussis>=n.cible; h+=`<div style="text-align:center"><div style="font-size:24px;font-weight:700;color:${ok?'#34c759':'#ff9500'}">${ok?'Défi réussi !':`Presque ! Il fallait ${n.cible} sur 10.`}</div>
        <div style="margin:10px 0">${ok?'Bravo ! Tu peux passer au niveau suivant.':'Relis les consignes et réessaie.'}</div><button data-r="nouveau" class="bouton" style="background:${col(COUL.vert)};width:auto;display:inline-flex;padding:12px 22px;border-radius:12px">Nouvel essai</button></div>`; }
      else { h+=`<div style="display:flex;gap:12px"><button data-r="ok" style="flex:1;min-height:90px;border-radius:20px;background:#34c759;font-size:24px;font-weight:700">Réussi</button><button data-r="ko" style="flex:1;min-height:90px;border-radius:20px;background:rgba(255,255,255,.2);font-size:24px;font-weight:700">Raté</button></div>
        ${st.res.length?`<button data-r="annuler" style="opacity:.8">Annuler le dernier</button>`:''}`; }
      h+='</div>'; }
    div.innerHTML=h+'</div>';
    const avant=WIDGETS.length; monterAnimations(div); for(let k=avant;k<WIDGETS.length;k++) WIDGETS[k].noir=true;
    div.querySelector('[data-x=fermer]').onclick=fermerNoir;
    div.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{st.p=+b.dataset.p; st.res=[]; rendre();});
    div.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{st.geste=b.dataset.v==='1'; rendre();});
    div.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ if(b.dataset.c==='go') st.actif=!st.actif; else {st.actif=false; st.sec=0;} rendre();});
    div.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const r=b.dataset.r; if(r==='ok') st.res.push(true); else if(r==='ko') st.res.push(false); else if(r==='annuler') st.res.pop(); else st.res=[]; rendre();});
  }
  rendre();
}

function terrainLignes(){

  ${[['rgb(51,140,255)','Lignes du simple : les côtés (terrain étroit)'],['rgb(255,153,26)','Lignes du double : les côtés extérieurs et la ligne de service long du double'],['#fff','Lignes communes : fond, service court, ligne centrale']]

function dessinerTerrainLignes(cv){
  const {g,w:W,h:H}=preparerCanvas(cv,13.4/6.1*1.03); const mg=10, sx=(W-2*mg)/13.4, sy=(H-2*mg)/6.1, m=(x,y)=>[mg+x*sx,mg+y*sy];
  const L=(x1,y1,x2,y2,c,e=3)=>trait(g,m(x1,y1),m(x2,y2),c,e,'butt');
  g.fillStyle=C(0.10,0.36,0.23); g.fillRect(0,0,W,H); g.fillStyle=C(0.16,0.52,0.33); g.fillRect(mg,mg,W-2*mg,H-2*mg);
  L(0,0,0,6.1,'#fff');L(13.4,0,13.4,6.1,'#fff');L(4.72,0,4.72,6.1,'#fff');L(8.68,0,8.68,6.1,'#fff');L(0,3.05,4.72,3.05,'#fff');L(8.68,3.05,13.4,3.05,'#fff');
  const o='rgb(255,153,26)', b='rgb(51,140,255)'; L(0,0,13.4,0,o,4);L(0,6.1,13.4,6.1,o,4);L(0.76,0,0.76,6.1,o,4);L(12.64,0,12.64,6.1,o,4);L(0,0.46,13.4,0.46,b,4);L(0,5.64,13.4,5.64,b,4);
  g.beginPath(); g.moveTo(...m(6.7,0)); g.lineTo(...m(6.7,6.1)); g.strokeStyle='#fff'; g.lineWidth=4; g.stroke(); g.setLineDash([3,3]); g.strokeStyle='#000'; g.stroke(); g.setLineDash([]);
}

  return {titre:'Outils',html:`<div class="pile"><div style="padding:0 4px 4px"><div style="font-size:34px;font-weight:700">Les outils 🧰</div>
    <div class="detail">Observer un camarade et tester tes connaissances. Touche un outil pour l'ouvrir.</div></div>
    ${ligneCarte('#/observer','👁️',COUL.vert,'Observer',"Je note où tombent les volants d'un camarade : dans le terrain, dehors ou dans le filet.")}
    ${ligneCarte('#/quiz','?',COUL.violet,'Le quiz des règles','10 questions avec les explications. Objectif : 8 bonnes réponses !')}</div>`};
}
function pageObserver(){
  const h=`<div class="pile serre"><input class="champ" id="prenom" placeholder="Prénom du joueur observé">
   <div class="detail">Touche là où tombe chaque volant : dans le terrain, dehors (bande grise) ou dans le filet (bande du bas).</div>
   <canvas id="obs" style="width:100%;max-width:340px;margin:0 auto;display:block;border-radius:8px;cursor:crosshair;touch-action:manipulation"></canvas>
   <div id="stats"></div><div id="conseil"></div>
   <div style="display:flex;gap:12px"><button class="bouton" style="background:rgba(118,118,128,.14);color:var(--vert);border-radius:12px" id="annul">↩︎ Annuler le dernier</button>
   <button class="bouton" style="background:rgba(118,118,128,.14);color:#ff3b30;border-radius:12px" id="raz">🗑 Tout effacer</button></div></div>`;
  return {titre:'Observer',retour:true,html:h,apres:pg=>{
    const imp=[]; const cv=pg.querySelector('#obs'), marge=0.09, hf=0.08;
    const n=t=>imp.filter(i=>i.type===t).length, nz=z=>imp.filter(i=>i.type==='dedans'&&i.zone===z).length;
    const pc=k=>imp.length?Math.round(k*100/imp.length)+' %':'–';
    function conseil(){ const N=imp.length; if(N<6) return 'Observe au moins 6 volants pour avoir un conseil.'; const de=n('dehors'),fi=n('filet');
      if((de+fi)/N>=0.3) return de>=fi?`Beaucoup de volants dehors (${de}). Vise un peu plus à l'intérieur du terrain et frappe moins fort.`:`Beaucoup de volants dans le filet (${fi}). Frappe plus haut et vise bien au-dessus du filet.`;
      const d=Math.max(1,n('dedans')); if(nz(0)/d<0.35) return 'Tu joues peu au fond. Fais reculer ton adversaire avec des dégagés hauts et longs.';
      if(nz(2)/d<0.15) return "Tu ne joues presque jamais près du filet. Essaie l'amorti quand ton adversaire est au fond.";
      if(nz(1)>nz(0)&&nz(1)>nz(2)) return "Beaucoup de volants au milieu : c'est facile pour l'adversaire. Vise le fond ou le filet.";
      return 'Peu de fautes et bien varié entre le fond et le filet. Continue comme ça !'; }
    function dessiner(){ const {g,w:W,h:H}=preparerCanvas(cv,0.8); const m=marge*W, fH=hf*H, ct={x:m,y:m,w:W-2*m,h:H-m-fH};
      g.fillStyle='#d1d1d6'; g.fillRect(0,0,W,H); texte(g,'DEHORS',W/2,m/2,11,'#6e6e73',700);
      g.fillStyle=C(0.18,0.56,0.35); g.fillRect(ct.x,ct.y,ct.w,ct.h); const mx=Math.max(1,nz(0),nz(1),nz(2));
      for(let z=0;z<3;z++){ g.fillStyle=`rgba(255,149,0,${0.65*nz(z)/mx})`; g.fillRect(ct.x,ct.y+z*ct.h/3,ct.w,ct.h/3); }
      const X=v=>ct.x+v/610*ct.w, Y=v=>ct.y+v/670*ct.h; g.beginPath(); g.rect(ct.x+1,ct.y+1,ct.w-2,ct.h-2);
      g.moveTo(X(0),Y(76));g.lineTo(X(610),Y(76));g.moveTo(X(0),Y(472));g.lineTo(X(610),Y(472));g.moveTo(X(305),Y(0));g.lineTo(X(305),Y(472));
      g.moveTo(X(46),Y(0));g.lineTo(X(46),Y(670));g.moveTo(X(564),Y(0));g.lineTo(X(564),Y(670)); g.strokeStyle='#fff'; g.lineWidth=2; g.stroke();
      texte(g,'FOND',W/2,ct.y+12,11,'rgba(255,255,255,.8)',700);
      g.fillStyle='rgba(0,0,0,.75)'; g.fillRect(ct.x,ct.y+ct.h,ct.w,fH); texte(g,'FILET',W/2,ct.y+ct.h+fH/2,11,'#fff',700);
      for(const i of imp){ const x=i.x*W,y=i.y*H; if(i.type==='dedans'){ g.beginPath(); g.arc(x,y,8,0,Math.PI*2); g.fillStyle='#fff'; g.fill(); g.strokeStyle='#000'; g.lineWidth=3; g.stroke(); }
        else texte(g,'✕',x,y,16,i.type==='dehors'?'#ff3b30':'#ffcc00',900); }
      cv._ct=ct; cv._fH=fH; }
    function maj(){ dessiner();
      const st=(t,k,al,sans)=>`<div class="stat" style="${al?'background:rgba(255,59,48,.08)':''}"><b style="color:${al&&k>0?'#ff3b30':'inherit'}">${sans?k:pc(k)}</b><span>${sans?t:t+' · '+k}</span></div>`;
      pg.querySelector('#stats').innerHTML=`<div style="display:flex;gap:8px">${st('Fond',nz(0))}${st('Milieu',nz(1))}${st('Près du filet',nz(2))}</div><div style="display:flex;gap:8px;margin-top:8px">${st('Dehors',n('dehors'),true)}${st('Dans le filet',n('filet'),true)}${st('Total',imp.length,false,true)}</div>`;
      const pr=pg.querySelector('#prenom').value.trim();
      pg.querySelector('#conseil').innerHTML=teinte(COUL.orange,`<div class="etiq" style="color:${col(COUL.orange)}">${pr?'Conseil pour '+esc(pr.toUpperCase()):'Conseil'}</div><b>${esc(conseil())}</b>`);
      pg.querySelector('#annul').disabled=!imp.length; pg.querySelector('#annul').style.opacity=imp.length?1:0.4; }
    cv.onclick=ev=>{ const b=cv.getBoundingClientRect(), x=ev.clientX-b.left, y=ev.clientY-b.top, ct=cv._ct, fH=cv._fH;
      let type='dehors', zone=-1;
      if(x>=ct.x&&x<=ct.x+ct.w&&y>=ct.y&&y<=ct.y+ct.h){ type='dedans'; const yt=(y-ct.y)/ct.h; zone=yt<1/3?0:yt<2/3?1:2; }
      else if(x>=ct.x&&x<=ct.x+ct.w&&y>ct.y+ct.h&&y<=ct.y+ct.h+fH) type='filet';
      imp.push({type,zone,x:x/b.width,y:y/b.height}); if(navigator.vibrate) navigator.vibrate(8); maj(); };
    pg.querySelector('#annul').onclick=()=>{imp.pop(); maj();}; pg.querySelector('#raz').onclick=()=>{imp.length=0; maj();};
    pg.querySelector('#prenom').oninput=maj; maj(); WIDGETS.push({dessiner:()=>{ if(cv.isConnected&&cv.width!==Math.round(cv.clientWidth*(devicePixelRatio||1))) dessiner(); }}); }};
}
function pageQuiz(){
  return {titre:'Quiz des règles',retour:true,html:'<div class="pile" id="quiz"></div>',apres:pg=>{
    const Q=DATA.quiz, st={i:0,choix:null,score:0}, z=pg.querySelector('#quiz');
    function rendre(){
      if(st.i>=Q.length){ const ok=st.score>=8; z.innerHTML=`<div class="carte" style="padding:24px;text-align:center;margin-top:20px"><div style="font-size:80px">${ok?'🏆':'💪'}</div>
        <div style="font:900 72px ui-rounded,-apple-system,sans-serif;color:${col(ok?COUL.vert:COUL.orange)}">${st.score} / ${Q.length}</div>
        <div class="titre" style="margin:10px 0 16px">${ok?'Bravo ! Tu peux valider le quiz (8 sur 10).':'Relis les explications et recommence.'}</div>
        <button class="bouton" style="background:${col([0.80,0.42,0.08])};width:auto;display:inline-flex;padding:12px 24px;border-radius:12px" id="re">Recommencer</button></div>`;
        z.querySelector('#re').onclick=()=>{st.i=0;st.score=0;st.choix=null;rendre();}; return; }
      const q=Q[st.i];
      let h=`<div style="height:6px;border-radius:3px;background:rgba(0,0,0,.08)"><div style="height:100%;width:${st.i/Q.length*100}%;border-radius:3px;background:${C(0.80,0.42,0.08)}"></div></div>
       <div class="detail">Question ${st.i+1} sur ${Q.length}</div>${teinte(COUL.violet,`<div style="font-size:22px;font-weight:700">${esc(q.question)}</div>`)}`;
      q.reponses.forEach((r,k)=>{ let bg='#fff', m=''; if(st.choix!=null){ if(k===q.bonne){bg='rgba(52,199,89,.18)';m='<i style="font-style:normal;color:#34c759">✔︎</i>';} else if(k===st.choix){bg='rgba(255,59,48,.15)';m='<i style="font-style:normal;color:#ff3b30">✖︎</i>';} }
        h+=`<button class="reponse" data-k="${k}" style="background:${bg}"><span>${esc(r)}</span>${m}</button>`; });
      if(st.choix!=null){ const bon=st.choix===q.bonne;
        h+=teinte([0.80,0.42,0.08],`<div class="titre" style="color:${bon?'#34c759':'#ff9500'}">${bon?'Bonne réponse !':'Pas tout à fait.'}</div><div style="margin-top:6px">${esc(q.explication)}</div>`,16,'background:rgba(204,107,20,.1)')+
         `<button class="bouton" style="background:${C(0.80,0.42,0.08)};border-radius:12px;min-height:50px" id="suiv">${st.i+1<Q.length?'Question suivante':'Voir mon score'}</button>`; }
      z.innerHTML=h;
      z.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ if(st.choix!=null) return; st.choix=+b.dataset.k; if(st.choix===q.bonne) st.score++; rendre(); });
      const s=z.querySelector('#suiv'); if(s) s.onclick=()=>{st.i++; st.choix=null; rendre(); window.scrollTo(0,0);};
    }
    rendre(); }};
}

// ---------- Présentation (premier lancement et « Comment marche l'appli ? »)
function ouvrirPresentation(premiere){
  const V=COUL.vert,O=COUL.orange,B=COUL.bleu,Vi=COUL.violet,R=COUL.rose;
  const sec=(e,t)=>`<div style="display:flex;gap:8px;font-size:22px;font-weight:700;margin-bottom:-12px"><span>${e}</span><span>${t}</span></div>`;
  const carte=(i,c,t,x)=>`<div class="ligne haut" style="padding:16px;border-radius:18px;background:#fff;border:2px solid ${col(c,0.35)}"><span class="icone" style="width:46px;height:46px;background:${col(c)};font-size:20px">${i}</span><div><div class="titre" style="color:${col(c)}">${t}</div><div style="font-size:15px;opacity:.8">${x}</div></div></div>`;
  const tuile=(i,c,t,x)=>`<div style="padding:14px;border-radius:18px;background:${col(c,0.14)};min-height:120px"><div style="font-size:24px;color:${col(c)}">${i}</div><div class="titre" style="margin-top:8px">${t}</div><div class="detail" style="font-size:12px;margin-top:4px">${x}</div></div>`;
  const grille=x=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${x}</div>`;
  const niv=(p,t,x,cl)=>`<div class="ligne" style="padding:14px;border-radius:18px;background:#fff;position:relative;overflow:hidden"><span style="position:absolute;left:0;top:12px;bottom:12px;width:6px;border-radius:3px;background:${teintePlume(p)}"></span>${pastille(p,42)}
    <div class="grandit"><div class="titre">${PLUMES[p].nom} · ${t}</div><div class="detail">${x}</div></div>${cl?`<span style="font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:${teintePlume(p)};color:${PLUMES[p].t}">${cl}</span>`:''}</div>`;
  const d=document.createElement('div'); d.className='modal';
  d.innerHTML=`<div class="in"><button class="fermer" data-f>Fermer</button>
   <div style="text-align:center;color:#fff;padding:28px 20px;border-radius:28px;background:linear-gradient(135deg,${col(V)},${C(0.15,0.65,0.55)},${col(B)});box-shadow:0 6px 16px ${col(V,0.35)};margin-top:-14px">
     <div style="width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:58px">🏸</div>
     <div style="font-size:34px;font-weight:700;margin-top:14px">Bienvenue ! 🏸</div><div style="font-weight:600;opacity:.95;margin-top:10px">Apprends le badminton pas à pas, à ton rythme, avec BadmintonEPS.</div></div>
   ${sec('🧭',"Dans l'appli")}<div class="pile serre">${carte('▦',V,'Thèmes',"La motricité : des bases jusqu'aux matchs à thème, dans l'ordre d'apprentissage. Les rôles et les règles : des fiches à lire, les règles les plus importantes en premier.")}
     ${carte('💡',O,"J'ai un problème","Mon volant ne passe pas le filet ? Mon service est faute ? Je trouve pourquoi, la solution et les exercices pour progresser.")}
     ${carte('👁',B,'Outils',"J'observe un camarade : je note où tombent ses volants, dedans, dehors ou dans le filet.")}</div>
   ${sec('🎯','Dans chaque exercice')}${grille(tuile('◎',V,'Le but',"Ce que j'apprends")+tuile('📦',B,'Le matériel',"Ce qu'il faut préparer")+tuile('👥',Vi,"L'organisation",'Qui fait quoi, et où')+tuile('★',O,'4 niveaux',"Je touche un niveau pour l'ouvrir"))}
   ${sec('⭐️','Dans chaque niveau')}${grille(tuile('▶',R,'Les animations','L\'exercice et le geste de profil, avec le ralenti')+tuile('1·2',B,'Ce que je dois faire','Les étapes, pour ce niveau')+tuile('👉',O,'Comment bien faire','Les consignes techniques')+tuile('✔︎',V,'Réussi si','Quand je peux passer au niveau suivant'))}
   <div class="ligne" style="gap:10px;padding:14px;border-radius:16px;background:${col(V,0.12)};font-size:15px;margin-top:-10px"><span style="color:${col(V)}">◫</span><span>Le bouton <b>Vue d'ensemble des 4 niveaux</b> affiche l'exercice en grand, sur fond noir : je passe d'un niveau à l'autre avec les boutons 1, 2, 3, 4.</span></div>
   ${sec('🏅','Quel niveau viser ?')}<div class="pile p10">${niv(1,'Je découvre','Pour commencer, quelle que soit ma classe')}${niv(2,'Je progresse',"L'objectif de la 6e",'6e')}${niv(3,'Objectif de la 5e à la 3e',"L'objectif du cycle 4",'5e · 4e · 3e')}${niv(4,'Expert','Pour les joueurs de club','Club')}</div>
   <div class="ligne" style="gap:12px;padding:16px;border-radius:18px;background:linear-gradient(90deg,${col(O)},${col(R)});color:#fff;margin-top:-10px"><span style="font-size:28px">🚀</span><b>Quand je réussis un niveau, je passe au suivant !</b></div>
   ${premiere?`<button data-f class="bouton" style="font-size:20px;font-weight:700;padding:16px;background:linear-gradient(90deg,${col(V)},${C(0.15,0.65,0.55)});box-shadow:0 4px 10px ${col(V,0.4)}">C'est parti ! 🏸</button>`:''}</div>`;
  document.getElementById('calque').appendChild(d); document.body.style.overflow='hidden';
  d.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ d.remove(); document.body.style.overflow=''; try{localStorage.setItem('presentationVue','1');}catch(e){} });
}

window.addEventListener('hashchange',routeur);
routeur(); demarrerBoucle();
let vue=false; try{vue=localStorage.getItem('presentationVue')==='1';}catch(e){}
if(!vue) ouvrirPresentation(true);
